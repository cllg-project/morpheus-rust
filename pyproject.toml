[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "pymorpheuslib"
version = "0.1.0"
description = "Ancient Greek and Latin morphological parser (Rust port of Perseus Morpheus)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MPL-1.1" }
authors = [{ name = "Thibault Clérice" }]
keywords = ["ancient-greek", "morphology", "nlp", "parser", "perseus", "morpheus"]
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing :: Linguistic",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
]

[project.urls]
Source = "https://github.com/alpheios-project/morpheus"

[tool.maturin]
manifest-path = "morpheus-py/Cargo.toml"
features = ["pyo3/extension-module"]
python-source = "python"
module-name = "morpheus._morpheus"
